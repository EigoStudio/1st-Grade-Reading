<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Asks for Help - Listening Quiz!</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-blue: #4a90e2;
            --success-green: #2ecc71;
            --accent-pink: #ff78ae;
            --bg-color: #f0f4f8;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        header h1 {
            color: var(--primary-blue);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* ステータスエリア */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score-badge { color: var(--success-green); }
        .progress-badge { color: var(--primary-blue); }

        /* オーディオトリガーエリア */
        .audio-section {
            background: #fff0f6;
            border: 2px dashed var(--accent-pink);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .audio-btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d64d8a;
            transition: all 0.1s;
            margin-bottom: 10px;
        }
        .audio-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #d64d8a;
        }

        .instruction {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4a5568;
        }

        /* 3択画像グリッド */
        .choices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 700px) {
            .choices-grid { grid-template-columns: 1fr; }
        }

        .card-btn {
            background: white;
            border: 4px solid #e2e8f0;
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .card-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .image-frame {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #fafafa;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f0f4f8;
        }
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .emotion-label {
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            color: #475569;
        }

        /* 正誤判定・ナビゲーション */
        .feedback-area {
            min-height: 40px;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .feedback-area.correct { color: var(--success-green); }
        .feedback-area.incorrect { color: #e74c3c; }

        .next-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #357abd;
            display: none;
            margin: 0 auto;
        }
        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #357abd;
        }

        /* 結果画面 */
        .result-screen {
            display: none;
            padding: 30px 10px;
        }
        .result-screen h2 {
            font-size: 2.5rem;
            color: var(--success-green);
            margin-bottom: 15px;
        }
        .result-screen p {
            font-size: 1.4rem;
            color: #4a5568;
            margin-bottom: 30px;
        }

        /* 状態変化用のスタイル */
        .card-btn.correct-choice { border-color: var(--success-green); background: #e8f8f0; }
        .card-btn.incorrect-choice { border-color: #e74c3c; background: #fde8e8; opacity: 0.7; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="game-play-area">
        <header>
            <h1>🎧 "Sarah Asks for Help" Listening Quiz</h1>
            <div class="subtitle">Listen and choose.</div>
        </header>

        <div class="status-bar">
            <span class="progress-badge">Question: <span id="current-q">1</span> / 6</span>
            <span class="score-badge">Score: <span id="current-score">0</span></span>
        </div>

        <div class="audio-section">
            <button class="audio-btn" onclick="playQuestionAudio()" title="Listen to the voice">🔊</button>
            <div class="instruction">Click the speaker to listen!</div>
        </div>

        <div class="choices-grid" id="choices-container">
            </div>

        <div class="feedback-area" id="feedback-message"></div>
        <button class="next-btn" id="next-question-btn" onclick="advanceGame()">Next Question ➔</button>
    </div>

    <div class="result-screen" id="game-end-area">
        <h2>🎉 Splendid Job!</h2>
        <p>You completed all 6 listening challenges!</p>
        <div style="font-size: 2rem; font-weight: bold; margin-bottom: 30px; color: var(--primary-blue);">
            Final Score: <span id="final-score">0</span> / 6
        </div>
        <button class="next-btn" style="display: inline-block;" onclick="resetGame()">Play Again 🔄</button>
    </div>
</div>

<script>
    // 厳選された6問のデータ
    const fullQuizData = [
        {
            audio: "Look! This is Sarah. She sits at her desk. She is wearing a blue T-shirt today.",
            correctPic: "images-Sarah/1-classroom.jpg",
            label: "Classroom",
            isQuestionOne: true 
        },
        {
            audio: "Listen! The teacher is talking. 'Please do page five,' the teacher says.",
            correctPic: "images-Sarah/2-teacher.jpg",
            label: "Teacher"
        },
        {
            audio: "Everyone is working. Sarah looks at her paper. She is reading the words. But wait! She does not understand.",
            correctPic: "images-Sarah/3-stuck.jpg",
            label: "Stuck"
        },
        {
            audio: "'I am stuck,' Sarah says.",
            correctPic: "images-Sarah/3-stuck.jpg",
            label: "Stuck"
        },
        {
            audio: "Sarah takes a deep breath. She lifts her arm. Look! She raises her hand high in the air!",
            correctPic: "images-Sarah/4-raising-hand.jpg",
            label: "Raising Hand"
        },
        {
            audio: "'Can you help me, please?' 'Yes, of course!' the teacher says. Sarah is smiling now. She is happy. She can do it!",
            correctPic: "images-Sarah/7-happy-end.jpg",
            label: "Happy Ending"
        }
    ];

    // 主要画像プール（2〜6問目のダミー生成用）
    const storyImagesPool = [
        { pic: "images-Sarah/1-classroom.jpg", label: "Classroom" },
        { pic: "images-Sarah/2-teacher.jpg", label: "Teacher" },
        { pic: "images-Sarah/3-stuck.jpg", label: "Stuck" },
        { pic: "images-Sarah/4-raising-hand.jpg", label: "Raising Hand" },
        { pic: "images-Sarah/7-happy-end.jpg", label: "Happy Ending" }
    ];

    let currentIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let preferredVoice = null;

    function initSpeech() {
        const voices = window.speechSynthesis.getVoices();
        preferredVoice = 
            voices.find(v => v.lang === "en-US" && v.name.includes("Google US English")) ||
            voices.find(v => v.lang === "en-US" && v.name.includes("Samantha")) ||
            voices.find(v => v.lang.startsWith("en-US"));
    }
    window.speechSynthesis.onvoiceschanged = initSpeech;
    initSpeech();

    function playQuestionAudio() {
        window.speechSynthesis.cancel();
        const text = fullQuizData[currentIndex].audio;
        const uttr = new SpeechSynthesisUtterance(text);
        if (preferredVoice) uttr.voice = preferredVoice;
        uttr.rate = 0.8; 
        uttr.pitch = 1.1;
        window.speechSynthesis.speak(uttr);
    }

    function setupQuestion() {
        hasAnswered = false;
        document.getElementById('current-q').innerText = currentIndex + 1;
        document.getElementById('current-score').innerText = score;
        document.getElementById('feedback-message').innerText = "";
        document.getElementById('feedback-message').className = "feedback-area";
        document.getElementById('next-question-btn').style.display = "none";

        const currentQuiz = fullQuizData[currentIndex];
        let choices = [];

        if (currentQuiz.isQuestionOne) {
            choices = [
                { pic: "images-Sarah/1-classroom.jpg", label: "Classroom", isCorrect: true },
                { pic: "images-Sarah/2-teacher.jpg", label: "Teacher", isCorrect: false },
                { pic: "images-Sarah/6-blackboard.jpg", label: "Blackboard", isCorrect: false }
            ];
        } else {
            choices.push({ pic: currentQuiz.correctPic, label: currentQuiz.label, isCorrect: true });
            
            let filteredPool = storyImagesPool.filter(item => item.pic !== currentQuiz.correctPic);
            filteredPool.sort(() => Math.random() - 0.5);
            
            for(let i = 0; i < 2; i++) {
                if(filteredPool[i]) {
                    choices.push({ pic: filteredPool[i].pic, label: filteredPool[i].label, isCorrect: false });
                }
            }
        }

        choices.sort(() => Math.random() - 0.5);

        const container = document.getElementById('choices-container');
        container.innerHTML = "";

        choices.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'card-btn';
            button.onclick = () => handleChoiceClick(button, choice.isCorrect);

            button.innerHTML = `
                <div class="image-frame">
                    <img src="${choice.pic}" alt="Story Scene">
                </div>
                <div class="emotion-label">${choice.label}</div>
            `;
            container.appendChild(button);
        });

        // ⚠️ 自動再生用タイマー（setTimeout）を綺麗に削除しました！
    }

    function handleChoiceClick(targetBtn, isCorrect) {
        if (hasAnswered) return;
        hasAnswered = true;

        window.speechSynthesis.cancel();
        const feedback = document.getElementById('feedback-message');
        const nextBtn = document.getElementById('next-question-btn');
        const allButtons = document.querySelectorAll('.card-btn');

        allButtons.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            targetBtn.classList.add('correct-choice');
            feedback.innerText = "✨ Correct! Awesome listening!";
            feedback.className = "feedback-area correct";
            score++;
            document.getElementById('current-score').innerText = score;
        } else {
            targetBtn.classList.add('incorrect-choice');
            feedback.innerText = "⚡ Let's look closer at the story scene.";
            feedback.className = "feedback-area incorrect";

            allButtons.forEach(btn => {
                if(btn.querySelector('img').getAttribute('src') === fullQuizData[currentIndex].correctPic) {
                    btn.classList.add('correct-choice');
                }
            });
        }

        nextBtn.style.display = "block";
    }

    function advanceGame() {
        currentIndex++;
        if (currentIndex < 6) {
            setupQuestion();
        } else {
            document.getElementById('game-play-area').style.display = 'none';
            document.getElementById('game-end-area').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        }
    }

    function resetGame() {
        currentIndex = 0;
        score = 0;
        document.getElementById('game-end-area').style.display = 'none';
        document.getElementById('game-play-area').style.display = 'block';
        setupQuestion();
    }

    window.onload = setupQuestion;
</script>

</body>
</html>
