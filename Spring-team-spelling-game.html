<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Spelling Game (IWB Edition) 🚀</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Hiragino Kaku Gothic ProN', sans-serif;
            background: linear-gradient(135deg, #2d004b, #6a1b9a, #9c27b0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            text-align: center;
            padding: 10px;
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 👑 【大改造】画面最上部に情報を集約するヘッダーエリア */
        #top-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 3px solid #fff;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 999;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            border-radius: 0 0 15px 15px;
        }

        /* 左右のミニスコア */
        .mini-score-box {
            font-size: 1.3rem;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            min-width: 110px;
        }
        .mini-score-box.active {
            background: rgba(225, 190, 231, 0.3);
            box-shadow: 0 0 10px #e1bee7;
            border: 1px solid #fff;
        }
        .score-val {
            font-size: 2.2rem;
            color: #ffeb3b;
            margin: 0;
        }

        /* 中央の現在のターンアナウンス（一番目立つ） */
        #turn-announcement {
            font-size: 2rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 10px #ffeb3b, 2px 2px 4px #000;
        }

        /* ミニロケットメーター */
        #mini-rocket-area {
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 1.1rem;
        }
        #rocket-visual { font-size: 2.2rem; margin: 0; }

        /* メインレイアウト（左側にゲーム、右側は手書き等の自由スペース用の幅広設計） */
        #main-layout {
            display: flex;
            justify-content: flex-start; /* 左寄せにして右側に余白を作る */
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
        }

        #game-container {
            flex: 0 0 850px; /* ゲームエリアの横幅を固定 */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* 音声ボタン */
        .audio-btn {
            background: linear-gradient(135deg, #e91e63, #ba1a52);
            color: white;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 85px;
            height: 85px;
            font-size: 2.8rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.1s;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:active { transform: scale(0.95); }

        /* 単語表示（小文字） */
        #word-display {
            font-size: min(3.5rem, 6vw); 
            letter-spacing: 0.15em; 
            white-space: nowrap; 
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 0 0 10px #e1bee7;
            min-height: 60px;
        }

        /* ⌨️ 【新機能】画面内スクリーンキーボード（タッチパネル対応） */
        #onscreen-keyboard {
            display: grid;
            grid-template-columns: repeat(13, 1fr); /* 13列×2行でa-zを配置 */
            gap: 8px;
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 15px;
        }

        .key-btn {
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 1.8rem;
            font-weight: bold;
            background: #fff;
            color: #333;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 8px 0;
            cursor: pointer;
            box-shadow: 0 4px 0 #bbb;
            transition: all 0.1s;
        }
        .key-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #bbb;
        }
        /* 使用済みのアルファベットボタンのスタイル */
        .key-btn:disabled {
            background: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.1);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* メッセージエリア */
        #message { font-size: 1.6rem; font-weight: bold; margin: 15px 0; min-height: 45px; }
        .success { color: #00e676; text-shadow: 1px 1px 2px #000; }
        .danger { color: #ff3d00; text-shadow: 1px 1px 2px #000; }

        #next-btn, #restart-btn {
            font-family: inherit;
            font-size: 1.6rem;
            padding: 12px 35px;
            border: 2px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #next-btn { background-color: #4caf50; color: white; display: none; margin: 15px auto 0 auto; }
        #restart-btn { background-color: #ffeb3b; color: #2d004b; display: block; margin: 20px auto 0 auto; }

        .winner-announcement {
            font-size: 2.8rem;
            color: #ffeb3b;
            font-weight: bold;
            text-shadow: 0 0 15px #ffeb3b, 2px 2px 4px #000;
            margin: 20px 0;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.03); } }

        /* キーボード非表示用の隠しインプット（物理キーボード対応用） */
        #hidden-input {
            position: absolute;
            left: -9999px;
        }
    </style>
</head>
<body>

    <div id="top-status-bar">
        <div id="teamA-mini" class="mini-score-box active">
            <div>🔴 TEAM A</div>
            <div id="scoreA" class="score-val">0</div>
        </div>

        <div id="turn-announcement">🔴 TEAM A's Turn!</div>

        <div id="mini-rocket-area">
            <div id="rocket-visual">🚀🔥✨</div>
            <div id="rocket-status">Fuel: 6/6</div>
        </div>

        <div id="teamB-mini" class="mini-score-box">
            <div>🔵 TEAM B</div>
            <div id="scoreB" class="score-val">0</div>
        </div>
    </div>

    <div id="main-layout">
        
        <div id="game-container">
            <div>
                <button class="audio-btn" onclick="speakWord()" title="Listen">🔊</button>
            </div>

            <div id="word-display">_ _ _ _</div>

            <div id="onscreen-keyboard" id="keyboard-container">
                </div>

            <div id="message"></div>
            
            <button id="next-btn" onclick="nextWord()">Next Word ➡️</button>
            
            <input type="text" id="hidden-input" autocomplete="off">
        </div>

        <div style="flex: 1;"></div>

    </div>

    <script>
        const wordBank = ["look", "cherry", "blossoms", "beautiful", "picnic", "tree", "bring", "party"];

        let currentIndex = 0;
        let currentWord = "";
        let guessedLetters = [];
        let maxWrong = 6;
        let wrongGuesses = 0;

        let scores = { A: 0, B: 0 };
        let currentTeam = 'A'; 

        const rocketStages = ["🚀🔥✨", "🚀🔥", "🚀", "🛸", "⚗️", "⚓", "💥"];
        let preferredVoice = null;

        function loadVoices() {
            if (!window.speechSynthesis) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;
            preferredVoice = 
                voices.find(v => v.lang === "en-US" && v.name.includes("Google US English")) ||
                voices.find(v => v.lang === "en-US" && v.name.includes("Samantha")) ||
                voices.find(v => v.lang.startsWith("en-US") && (v.name.includes("Female") || v.name.includes("Zira"))) ||
                voices.find(v => v.lang.startsWith("en"));
        }
        
        if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // スクリーンキーボード（a-z）を画面に生成する関数
        function buildKeyboard() {
            const keyboardContainer = document.getElementById("onscreen-keyboard");
            keyboardContainer.innerHTML = ""; // 初期化
            const alphabet = "abcdefghijklmnopqrstuvwxyz";
            
            for (let char of alphabet) {
                const btn = document.createElement("button");
                btn.className = "key-btn";
                btn.innerText = char;
                btn.id = `key-${char}`;
                // タッチされたらその文字を推測として処理
                btn.onclick = () => handleLetterSelect(char);
                keyboardContainer.appendChild(btn);
            }
        }

        function initGame() {
            currentWord = wordBank[currentIndex].toLowerCase();
            guessedLetters = [];
            wrongGuesses = 0;
            
            document.getElementById("message").innerHTML = "";
            document.getElementById("message").className = "";
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("onscreen-keyboard").style.display = "grid";
            
            buildKeyboard(); // キーボードをピカピカの状態で再配置
            updateDisplay();
            updateTurnUI();

            // 物理キーボード用のフォーカス合わせ
            document.getElementById("hidden-input").focus();
        }

        function updateDisplay() {
            let displayString = "";
            for (let char of currentWord) {
                if (guessedLetters.includes(char)) {
                    displayString += char.toLowerCase() + " ";
                } else {
                    displayString += "_ ";
                }
            }
            document.getElementById("word-display").innerHTML = displayString.trim();

            let fuelLeft = maxWrong - wrongGuesses;
            document.getElementById("rocket-status").innerText = `Fuel: ${fuelLeft}/${maxWrong}`;
            document.getElementById("rocket-visual").innerText = rocketStages[wrongGuesses];

            // 使用済みボタンの無効化（グレーアウト処理）
            guessedLetters.forEach(char => {
                const btn = document.getElementById(`key-${char}`);
                if (btn) btn.disabled = true;
            });

            document.getElementById("scoreA").innerText = scores.A;
            document.getElementById("scoreB").innerText = scores.B;
        }

        function updateTurnUI() {
            const turnText = currentTeam === 'A' ? "🔴 TEAM A's Turn!" : "🔵 TEAM B's Turn!";
            document.getElementById("turn-announcement").innerText = turnText;

            if (currentTeam === 'A') {
                document.getElementById("teamA-mini").classList.add("active");
                document.getElementById("teamB-mini").classList.remove("active");
            } else {
                document.getElementById("teamB-mini").classList.add("active");
                document.getElementById("teamA-mini").classList.remove("active");
            }
        }

        function speakWord() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                let uttr = new SpeechSynthesisUtterance(currentWord);
                uttr.lang = 'en-US'; 
                uttr.rate = 0.72;  
                uttr.pitch = 1.15; 
                if (preferredVoice) uttr.voice = preferredVoice;
                window.speechSynthesis.speak(uttr);
            }
        }

        // 文字が選ばれたときのメイン処理（画面キーボード・物理キーボード共通）
        function handleLetterSelect(guess) {
            if (guessedLetters.includes(guess)) return;

            guessedLetters.push(guess);

            let matchCount = 0;
            for (let char of currentWord) {
                if (char === guess) {
                    matchCount++;
                }
            }

            if (matchCount > 0) {
                scores[currentTeam] += matchCount;
                document.getElementById("message").innerHTML = `Correct! TEAM ${currentTeam} gets ${matchCount} point(s)! 🎉`;
                document.getElementById("message").className = "success";
            } else {
                wrongGuesses++;
                document.getElementById("message").innerHTML = `Wrong! Next Team's Turn! 🧑‍🚀`;
                document.getElementById("message").className = "danger";
                currentTeam = (currentTeam === 'A') ? 'B' : 'A';
            }

            updateDisplay();
            updateTurnUI();
            checkGameStatus();
        }

        function checkGameStatus() {
            let won = true;
            for (let char of currentWord) {
                if (!guessedLetters.includes(char)) {
                    won = false;
                    break;
                }
            }

            if (won) {
                document.getElementById("message").innerHTML = `🌟 Wonderful! Clear! 🚀✨`;
                document.getElementById("message").className = "success";
                document.getElementById("rocket-visual").innerText = "🚀💨⚡⭐";
                endRound();
            } else if (wrongGuesses >= maxWrong) {
                document.getElementById("message").innerHTML = `Game Over! The word was: <strong>${currentWord.toLowerCase()}</strong>`;
                document.getElementById("message").className = "danger";
                endRound();
            }
        }

        function endRound() {
            document.getElementById("onscreen-keyboard").style.display = "none";
            
            if (currentIndex >= wordBank.length - 1) {
                showFinalResult();
            } else {
                document.getElementById("next-btn").style.display = "block";
            }
        }

        function showFinalResult() {
            document.getElementById("turn-announcement").innerText = "🏆 FINAL RESULT 🏆";
            document.getElementById("teamA-mini").classList.remove("active");
            document.getElementById("teamB-mini").classList.remove("active");

            let resultHTML = "";
            if (scores.A > scores.B) {
                resultHTML = `<div class="winner-announcement">🎉 🔴 TEAM A WINS! 🎉</div>`;
            } else if (scores.B > scores.A) {
                resultHTML = `<div class="winner-announcement">🎉 🔵 TEAM B WINS! 🎉</div>`;
            } else {
                resultHTML = `<div class="winner-announcement">🤝 IT's A TIE! (DRAW) 🤝</div>`;
            }

            document.getElementById("message").innerHTML = resultHTML;
            document.getElementById("message").className = "";
            
            const restartBtn = document.createElement("button");
            restartBtn.id = "restart-btn";
            restartBtn.innerText = "Play Again 🔄";
            restartBtn.onclick = resetWholeGame;
            document.getElementById("message").appendChild(restartBtn);
        }

        function resetWholeGame() {
            currentIndex = 0;
            scores.A = 0;
            scores.B = 0;
            currentTeam = 'A';
            initGame();
        }

        function nextWord() {
            currentIndex++; 
            initGame();
        }

        // 物理キーボードでタイピングされた時も反応させるバックアップ処理
        document.getElementById("hidden-input").addEventListener("input", function(e) {
            let val = e.target.value.toLowerCase().trim();
            e.target.value = ""; // すぐに空にする
            if (val.length === 1 && /[a-z]/.test(val)) {
                handleLetterSelect(val);
            }
        });
        // どこをクリックしても物理キーボードのフォーカスが外れないようにする対策
        document.addEventListener("click", function() {
            document.getElementById("hidden-input").focus();
        });

        window.onload = initGame;
    </script>
</body>
</html>
