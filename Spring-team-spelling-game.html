<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Spelling Game (IWB Fixed Edition) 🚀</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Hiragino Kaku Gothic ProN', sans-serif;
            /* 🎨 【修正】アニメーションを完全に廃止し、目に優しい落ち着いたディープパープルに固定 */
            background-color: #311b92; 
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: #fff;
            text-shadow: 0 0 10px #e1bee7, 0 0 20px #e1bee7;
            font-size: 3rem;
            margin: 0 0 25px 0;
        }

        /* 👑 画面最上部のステータスバー */
        #top-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 4px solid #fff;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 999;
            max-width: 1000px;
            margin: 0 auto 25px auto;
            border-radius: 0 0 20px 20px;
        }

        /* チームスコアボックス */
        .mini-score-box {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            min-width: 140px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        
        /* 🔴 TEAM A がアクティブな時（点滅なし・色固定） */
        .active-team-A {
            background: rgba(255, 64, 129, 0.5) !important;
            border-color: #ff4081 !important;
            box-shadow: 0 0 20px #ff4081;
            transform: scale(1.05);
        }

        /* 🔵 TEAM B がアクティブな時（点滅なし・色固定） */
        .active-team-B {
            background: rgba(0, 230, 255, 0.5) !important;
            border-color: #00e6ff !important;
            box-shadow: 0 0 20px #00e6ff;
            transform: scale(1.05);
        }

        .score-val {
            font-size: 2.8rem;
            color: #ffeb3b;
            margin: 5px 0 0 0;
            font-weight: bold;
        }

        /* 中央のターンアナウンス */
        #turn-announcement {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 15px #ffeb3b, 3px 3px 5px #000;
        }

        /* ミニロケットメーター */
        #mini-rocket-area {
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #rocket-visual { font-size: 2.5rem; margin: 0; }

        /* 🎯 メインゲームレイアウト */
        #main-layout {
            display: flex;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        #game-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* 音声ボタン */
        .audio-btn {
            background: linear-gradient(135deg, #e91e63, #ba1a52);
            color: white;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 95px;
            height: 95px;
            font-size: 3rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:active { transform: scale(0.92); }

        /* 単語表示 */
        #word-display {
            font-size: min(3.8rem, 6vw); 
            letter-spacing: 0.15em; 
            white-space: nowrap; 
            margin: 30px 0;
            font-weight: bold;
            text-shadow: 0 0 10px #e1bee7;
            min-height: 70px;
        }

        /* ⌨️ 13列×2段に固定されたキーボード */
        #onscreen-keyboard {
            display: grid;
            grid-template-columns: repeat(13, 1fr); 
            gap: 10px;
            margin: 25px auto;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            max-width: 950px; 
        }

        .key-btn {
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 2rem; 
            font-weight: bold;
            background: #fff;
            color: #333;
            border: 3px solid #ccc;
            border-radius: 12px;
            padding: 12px 0;
            cursor: pointer;
            box-shadow: 0 5px 0 #bbb;
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .key-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #bbb;
        }
        .key-btn:disabled {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.05);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* メッセージ */
        #message { font-size: 1.8rem; font-weight: bold; margin: 20px 0; min-height: 50px; }
        .success { color: #00e676; text-shadow: 1px 1px 3px #000; }
        .danger { color: #ff3d00; text-shadow: 1px 1px 3px #000; }

        #next-btn, #restart-btn {
            font-family: inherit;
            font-size: 1.6rem;
            padding: 12px 35px;
            border: 2px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #next-btn { background-color: #4caf50; color: white; display: none; margin: 15px auto 0 auto; }
        #restart-btn { background-color: #ffeb3b; color: #2d004b; display: block; margin: 20px auto 0 auto; }

        .winner-announcement {
            font-size: 3rem;
            color: #ffeb3b;
            font-weight: bold;
            text-shadow: 0 0 15px #ffeb3b, 2px 2px 4px #000;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div id="top-status-bar">
        <div id="teamA-mini" class="mini-score-box">
            <div>🔴 TEAM A</div>
            <div id="scoreA" class="score-val">0</div>
        </div>

        <div id="turn-announcement">🔴 TEAM A's Turn!</div>

        <div id="mini-rocket-area">
            <div id="rocket-visual">🚀🔥✨</div>
            <div id="rocket-status">Fuel: 6/6</div>
        </div>

        <div id="teamB-mini" class="mini-score-box">
            <div>🔵 TEAM B</div>
            <div id="scoreB" class="score-val">0</div>
        </div>
    </div>

    <div id="main-layout">
        <div id="game-container">
            <div>
                <button class="audio-btn" onclick="speakWord()" title="Listen">🔊</button>
            </div>

            <div id="word-display">_ _ _ _</div>

            <div id="onscreen-keyboard"></div>

            <div id="message"></div>
            
            <button id="next-btn" onclick="nextWord()">Next Word ➡️</button>
        </div>
    </div>

    <script>
        const wordBank = ["look", "cherry", "blossoms", "beautiful", "picnic", "tree", "bring", "party"];

        let currentIndex = 0;
        let currentWord = "";
        let guessedLetters = [];
        let maxWrong = 6;
        let wrongGuesses = 0;

        let scores = { A: 0, B: 0 };
        let currentTeam = 'A'; 

        const rocketStages = ["🚀🔥✨", "🚀🔥", "🚀", "🛸", "⚗️", "⚓", "💥"];
        let preferredVoice = null;

        function loadVoices() {
            if (!window.speechSynthesis) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;
            preferredVoice = 
                voices.find(v => v.lang === "en-US" && v.name.includes("Google US English")) ||
                voices.find(v => v.lang === "en-US" && v.name.includes("Samantha")) ||
                voices.find(v => v.lang.startsWith("en-US") && (v.name.includes("Female") || v.name.includes("Zira"))) ||
                voices.find(v => v.lang.startsWith("en"));
        }
        
        if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function buildKeyboard() {
            const keyboardContainer = document.getElementById("onscreen-keyboard");
            keyboardContainer.innerHTML = ""; 
            const alphabet = "abcdefghijklmnopqrstuvwxyz";
            
            for (let char of alphabet) {
                const btn = document.createElement("button");
                btn.className = "key-btn";
                btn.innerText = char;
                btn.id = `key-${char}`;
                btn.onclick = () => handleLetterSelect(char);
                keyboardContainer.appendChild(btn);
            }
        }

        function initGame() {
            currentWord = wordBank[currentIndex].toLowerCase();
            guessedLetters = [];
            wrongGuesses = 0;
            
            document.getElementById("message").innerHTML = "";
            document.getElementById("message").className = "";
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("onscreen-keyboard").style.display = "grid";
            
            buildKeyboard(); 
            updateDisplay();
            updateTurnUI();
        }

        function updateDisplay() {
            let displayString = "";
            for (let char of currentWord) {
                if (guessedLetters.includes(char)) {
                    displayString += char.toLowerCase() + " ";
                } else {
                    displayString += "_ ";
                }
            }
            document.getElementById("word-display").innerHTML = displayString.trim();

            let fuelLeft = maxWrong - wrongGuesses;
            document.getElementById("rocket-status").innerText = `Fuel: ${fuelLeft}/${maxWrong}`;
            document.getElementById("rocket-visual").innerText = rocketStages[wrongGuesses];

            guessedLetters.forEach(char => {
                const btn = document.getElementById(`key-${char}`);
                if (btn) btn.disabled = true;
            });

            document.getElementById("scoreA").innerText = scores.A;
            document.getElementById("scoreB").innerText = scores.B;
        }

        function updateTurnUI() {
            const turnText = currentTeam === 'A' ? "🔴 TEAM A's Turn!" : "🔵 TEAM B's Turn!";
            document.getElementById("turn-announcement").innerText = turnText;

            const teamABox = document.getElementById("teamA-mini");
            const teamBBox = document.getElementById("teamB-mini");

            if (currentTeam === 'A') {
                teamABox.className = "mini-score-box active-team-A";
                teamBBox.className = "mini-score-box";
            } else {
                teamABox.className = "mini-score-box";
                teamBBox.className = "mini-score-box active-team-B";
            }
        }

        // 音声呼び出し処理
        function speakWord() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                let uttr = new SpeechSynthesisUtterance(currentWord);
                uttr.lang = 'en-US'; 
                uttr.rate = 0.72;  
                uttr.pitch = 1.15; 
                if (preferredVoice) uttr.voice = preferredVoice;
                window.speechSynthesis.speak(uttr);
            }
        }

        function handleLetterSelect(guess) {
            if (guessedLetters.includes(guess)) return;

            guessedLetters.push(guess);

            let matchCount = 0;
            for (let char of currentWord) {
                if (char === guess) {
                    matchCount++;
                }
            }

            if (matchCount > 0) {
                scores[currentTeam] += matchCount;
                document.getElementById("message").innerHTML = `Correct! TEAM ${currentTeam} gets ${matchCount} point(s)! 🎉`;
                document.getElementById("message").className = "success";
            } else {
                wrongGuesses++;
                document.getElementById("message").innerHTML = `Wrong! Next Team's Turn! 🧑‍🚀`;
                document.getElementById("message").className = "danger";
                currentTeam = (currentTeam === 'A') ? 'B' : 'A';
            }

            updateDisplay();
            updateTurnUI();
            checkGameStatus();
        }

        function checkGameStatus() {
            let won = true;
            for (let char of currentWord) {
                if (!guessedLetters.includes(char)) {
                    won = false;
                    break;
                }
            }

            if (won) {
                document.getElementById("message").innerHTML = `🌟 Wonderful! Clear! 🚀✨`;
                document.getElementById("message").className = "success";
                document.getElementById("rocket-visual").innerText = "🚀💨⚡⭐";
                endRound();
            } else if (wrongGuesses >= maxWrong) {
                document.getElementById("message").innerHTML = `Game Over! The word was: <strong>${currentWord.toLowerCase()}</strong>`;
                document.getElementById("message").className = "danger";
                endRound();
            }
        }

        function endRound() {
            document.getElementById("onscreen-keyboard").style.display = "none";
            
            if (currentIndex >= wordBank.length - 1) {
                showFinalResult();
            } else {
                document.getElementById("next-btn").style.display = "block";
            }
        }

        function showFinalResult() {
            document.getElementById("turn-announcement").innerText = "🏆 FINAL RESULT 🏆";
            document.getElementById("teamA-mini").className = "mini-score-box";
            document.getElementById("teamB-mini").className = "mini-score-box";

            let resultHTML = "";
            if (scores.A > scores.B) {
                resultHTML = `<div class="winner-announcement">🎉 🔴 TEAM A WINS! 🎉</div>`;
            } else if (scores.B > scores.A) {
                resultHTML = `<div class="winner-announcement">🎉 🔵 TEAM B WINS! 🎉</div>`;
            } else {
                resultHTML = `<div class="winner-announcement">🤝 IT's A TIE! (DRAW) 🤝</div>`;
            }

            document.getElementById("message").innerHTML = resultHTML;
            document.getElementById("message").className = "";
            
            const restartBtn = document.createElement("button");
            restartBtn.id = "restart-btn";
            restartBtn.innerText = "Play Again 🔄";
            restartBtn.onclick = resetWholeGame;
            document.getElementById("message").appendChild(restartBtn);
        }

        function resetWholeGame() {
            currentIndex = 0;
            scores.A = 0;
            scores.B = 0;
            currentTeam = 'A';
            initGame();
        }

        function nextWord() {
            currentIndex++; 
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
