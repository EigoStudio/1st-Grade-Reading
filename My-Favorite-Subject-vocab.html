<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語リスニング2択クイズ</title>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .quiz-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: #555;
            font-weight: bold;
        }

        .audio-section {
            margin: 20px 0 30px;
        }

        .btn-speech {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-speech:hover {
            background-color: #e68a00;
        }

        .btn-speech:active {
            transform: scale(0.96);
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card-choice {
            background: #fafafa;
            border: 4px solid #e0e0e0;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-choice:hover {
            border-color: #4a90e2;
            transform: translateY(-3px);
        }

        .card-choice img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-choice.correct {
            border-color: #28a745 !important;
            background-color: #e8f5e9;
        }

        .card-choice.wrong {
            border-color: #dc3545 !important;
            background-color: #ffebee;
            opacity: 0.6;
        }

        .card-choice.disabled {
            pointer-events: none;
        }

        .feedback-area {
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .result-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-text.correct { color: #28a745; }
        .result-text.wrong { color: #dc3545; }

        .revealed-english {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            background-color: #f1f3f5;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .btn-next {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: none;
        }

        .result-screen {
            display: none;
        }

        .btn-restart {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* アクセス拒否メッセージのスタイル */
        .access-denied {
            font-size: 1.3rem;
            color: #dc3545;
            font-weight: bold;
            padding: 40px 10px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- クイズ画面 -->
        <div id="quiz-screen" style="display: none;">
            <div class="header">
                <span>問題 <span id="current-question">1</span> / 30</span>
                <span>スコア: <span id="score">0</span></span>
            </div>

            <div class="audio-section">
                <button class="btn-speech" id="btn-play" onclick="playCurrentAudio()">
                    🔊 もう一度聴く
                </button>
            </div>

            <!-- 2択画像 -->
            <div class="choices-grid">
                <div class="card-choice" id="choice-0" onclick="selectAnswer(0)">
                    <img id="img-0" src="" alt="Choice 1">
                </div>
                <div class="card-choice" id="choice-1" onclick="selectAnswer(1)">
                    <img id="img-1" src="" alt="Choice 2">
                </div>
            </div>

            <!-- 答え合わせ（テキスト表示部） -->
            <div class="feedback-area">
                <div class="result-text" id="result-status"></div>
                <div class="revealed-english" id="revealed-text"></div>
                <button class="btn-next" id="btn-next" onclick="nextQuestion()">次の問題へ ➔</button>
            </div>
        </div>

        <!-- 最終結果画面 -->
        <div id="result-screen" class="result-screen">
            <h2>🎉 全30問クリア！ 🎉</h2>
            <p style="font-size: 1.5rem;">あなたのスコア: <span id="final-score">0</span> / 30</p>
            <button class="btn-restart" onclick="startQuiz()">最初からやり直す</button>
        </div>

        <!-- 暗号入力エラー時画面 -->
        <div id="denied-screen" class="access-denied" style="display: none;">
            🔒 コードが違います。ページを再読み込みして正しく入力してください。
        </div>
    </div>

    <script>
        // 暗号認証処理
        function authenticate() {
            const SECRET_CODE = "asatama";
            const userInput = prompt("パスコードを入力してください:");

            if (userInput === SECRET_CODE) {
                document.getElementById('quiz-screen').style.display = 'block';
                startQuiz();
            } else {
                document.getElementById('denied-screen').style.display = 'block';
            }
        }

        const allVocab = [
            { img: 'draw-a-picture.png', text: 'draw a picture' },
            { img: 'read-a-book.png', text: 'read a book' },
            { img: 'play-soccer.png', text: 'play soccer' },
            { img: 'play-basketball.png', text: 'play basketball' },
            { img: 'sing-a-song.png', text: 'sing a song' },
            { img: 'speak-english.png', text: 'speak English' },
            { img: 'look-at-the-blackboard.png', text: 'look at the blackboard' },
            { img: 'play-the-piano.png', text: 'play the piano' },
            { img: '50-plus-50.png', text: '50 plus 50' },
            { img: 'a-big-map.png', text: 'a big map' },
            { img: 'a-cute-cat.png', text: 'a cute cat' },
            { img: 'different-countries.png', text: 'different countries' },
            { img: 'look-at-the-map.png', text: 'look at the map' },
            { img: 'go-to-egypt.png', text: 'go to Egypt' },
            { img: 'see-the-pyramids.png', text: 'see the Pyramids' },
            { img: 'flowers.png', text: 'flowers' },
            { img: 'bugs.png', text: 'bugs' },
            { img: 'animals.png', text: 'animals' },
            { img: 'a-small-book.png', text: 'a small book' },
            { img: 'run-very-fast.png', text: 'run very fast' },
            { img: 'jump-high.png', text: 'jump high' },
            { img: 'beautiful-voice.png', text: 'beautiful voice' },
            { img: 'listen.png', text: 'Listen' },
            { img: 'look.png', text: 'Look' },
            { img: 'favorite-subject.png', text: 'favorite subject' },
            { img: 'can-you-see.png', text: 'Can you see' },
            { img: 'play-with-friends.png', text: 'play with friends' },
            { img: 'people-from-america.png', text: 'people from America' },
            { img: 'a-book-about-bugs.png', text: 'a book about bugs' },
            { img: 'nice-to-meet-you.png', text: 'Nice to meet you' }
        ];

        const dummyMap = {
            'see the Pyramids': 'see-the-coloseum.png',
            'people from America': 'people-from-australia.png',
            'go to Egypt': 'go-to-china.png',
            '50 plus 50': '50-minus-15.png',
            'Can you see': 'can-you-write.png',
            'beautiful voice': 'a-beautiful-dress.png',
            'Nice to meet you': 'see-you.png',
            'Look': 'listen.png',
            'Listen': 'look.png',
            'a cute cat': 'bugs.png',
            'different countries': 'people-from-america.png',
            'play soccer': 'play-basketball.png',
            'play basketball': 'play-soccer.png',
            'play the piano': 'sing-a-song.png',
            'sing a song': 'play-the-piano.png',
            'run very fast': 'jump-high.png',
            'jump high': 'run-very-fast.png',
            'read a book': 'draw-a-picture.png',
            'draw a picture': 'read-a-book.png',
            'look at the blackboard': 'speak-english.png',
            'speak English': 'look-at-the-blackboard.png',
            'play with friends': 'speak-english.png',
            'look at the map': 'play-with-friends.png',
            'animals': 'bugs.png',
            'bugs': 'animals.png',
            'a big book': 'a-small-book.png',
            'a small book': 'a-big-book.png',
            'a book about bugs': 'a-big-book.png',
            'flowers': 'bugs.png'
        };

        const folderPath = 'images-favorite-subject-vocab/';
        let quizQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let currentChoices = [];
        let correctChoiceIndex = -1;
        let answered = false;
        let preferredVoice = null;

        function loadVoices() {
            if (typeof window === 'undefined' || !window.speechSynthesis) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;
            preferredVoice = 
                voices.find(v => v.lang === "en-US" && v.name.includes("Google US English")) ||
                voices.find(v => v.lang === "en-US" && v.name.includes("Samantha")) ||
                voices.find(v => v.lang.startsWith("en-US")) ||
                voices.find(v => v.lang.startsWith("en"));
        }

        if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function convertNumbersToWords(text) {
            return text
                .replace(/\b50\b/g, "fifty")
                .replace(/\b100\b/g, "one hundred")
                .replace(/\b15\b/g, "fifteen")
                .replace(/\b35\b/g, "thirty five");
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            
            let cleanedText = text.replace(/["'?!.,“]/g, "");
            cleanedText = convertNumbersToWords(cleanedText);

            const utterance = new SpeechSynthesisUtterance(cleanedText);
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.rate = 0.65;
            utterance.pitch = 1.15;
            window.speechSynthesis.speak(utterance);
        }

        function startQuiz() {
            quizQuestions = [...allVocab].sort(() => Math.random() - 0.5);
            currentIdx = 0;
            score = 0;

            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';

            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const currentItem = quizQuestions[currentIdx];

            document.getElementById('current-question').textContent = currentIdx + 1;
            document.getElementById('score').textContent = score;

            document.getElementById('result-status').textContent = '';
            document.getElementById('revealed-text').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';

            let wrongImg = dummyMap[currentItem.text];
            if (!wrongImg) {
                const wrongOptions = allVocab.filter(item => item.text !== currentItem.text);
                wrongImg = wrongOptions[Math.floor(Math.random() * wrongOptions.length)].img;
            }

            const currentObj = { img: currentItem.img, text: currentItem.text };
            const wrongObj = { img: wrongImg, text: 'dummy' };

            currentChoices = [currentObj, wrongObj].sort(() => Math.random() - 0.5);
            correctChoiceIndex = currentChoices.findIndex(item => item.text === currentItem.text);

            for (let i = 0; i < 2; i++) {
                const card = document.getElementById(`choice-${i}`);
                card.className = 'card-choice';
                document.getElementById(`img-${i}`).src = folderPath + currentChoices[i].img;
            }

            setTimeout(() => {
                speak(currentItem.text);
            }, 300);
        }

        function playCurrentAudio() {
            speak(quizQuestions[currentIdx].text);
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const currentItem = quizQuestions[currentIdx];

            for (let i = 0; i < 2; i++) {
                document.getElementById(`choice-${i}`).classList.add('disabled');
            }

            const statusEl = document.getElementById('result-status');
            if (selectedIndex === correctChoiceIndex) {
                document.getElementById(`choice-${selectedIndex}`).classList.add('correct');
                statusEl.textContent = '⭕ 正解！';
                statusEl.className = 'result-text correct';
                score++;
                document.getElementById('score').textContent = score;
            } else {
                document.getElementById(`choice-${selectedIndex}`).classList.add('wrong');
                document.getElementById(`choice-${correctChoiceIndex}`).classList.add('correct');
                statusEl.textContent = '❌ 残念！';
                statusEl.className = 'result-text wrong';
            }

            const textEl = document.getElementById('revealed-text');
            textEl.textContent = currentItem.text;
            textEl.style.display = 'inline-block';

            document.getElementById('btn-next').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').textContent = score;
        }

        // ページ読み込み時に暗号認証を実行
        window.onload = authenticate;
    </script>
</body>
</html>
